spring:
  application:
    name: order-service

  h2:
    console:
      enabled: true
  datasource:
    url: jdbc:h2:mem:test
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: create
