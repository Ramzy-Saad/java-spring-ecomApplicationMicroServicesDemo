services:
  postgres:
    image: postgres:latest
    container_name: ecom-postgres
    environment:
      POSTGRES_DB: ecomdb
      POSTGRES_USER: ecom
      POSTGRES_PASSWORD: ecom
      PGDATA: /data/postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres:/data/postgre
    networks:
      - postgres
    restart: unless-stopped
  pgadmin:
    container_name: pgadmin-postgres
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgamdin@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'false'
    ports:
      - "5050:80"
    volumes:
      - pgadmin:/var/lib/pgadmin
    networks:
      - postgres
    restart: unless-stopped
networks:
  postgres:
    driver: bridge

volumes:
  postgres:
  pgadmin: